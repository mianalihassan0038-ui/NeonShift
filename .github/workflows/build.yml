name: Test and build Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: Rule tests (no Unity)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Mono
        run: sudo apt-get update -q && sudo apt-get install -y -q mono-devel
      - name: Run tests
        run: tools/run-core-tests.sh

  android:
    name: Build Android APK
    needs: core-tests
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
    steps:
      - name: Check Unity secrets
        run: |
          if [ -z "$UNITY_LICENSE" ] || [ -z "$UNITY_EMAIL" ] || [ -z "$UNITY_PASSWORD" ]; then
            echo "::error::Add UNITY_LICENSE, UNITY_EMAIL and UNITY_PASSWORD in Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: false

      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-Android-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-Android-

      - name: Build with Unity (GameCI)
        uses: game-ci/unity-builder@v4
        env:
          NEONSHIFT_VERSION: 0.4.${{ github.run_number }}
        with:
          targetPlatform: Android
          androidExportType: androidPackage
          buildName: NeonShift
          buildMethod: NeonShift.EditorTools.BuildScript.BuildAndroid
          allowDirtyBuild: true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NeonShift-apk
          path: build/Android/*.apk
          if-no-files-found: error

      - name: Publish release with APK
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.4.${{ github.run_number }}
          name: NEON SHIFT 0.4.${{ github.run_number }}
          body: |
            Android test build of NEON SHIFT from commit ${{ github.sha }}.
            Download **NeonShift.apk** below and open it on your phone (allow "Install unknown apps" when asked).
          files: build/Android/NeonShift.apk
          make_latest: true
